<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuweiba Camps × ProMedia — Strategic Growth Proposal 2026</title>
  <meta name="description" content="Brand Development & Accelerated Digital Growth Strategy for Nuweiba Camps, South Sinai. Prepared by ProMedia Production House 2026." />
  <link rel="icon" type="image/png" href="./assets/logos/nuweiba-logo.png" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- Global Scroll Progress Indicator -->
  <div id="scroll-progress"></div>

  <!-- Persistent Top Navigation Bar -->
  <header class="top-nav">
    <div class="nav-container">
      <div class="brand-wrapper">
        <div class="brand-logos">
          <img src="./assets/logos/nuweiba-logo.png" alt="Nuweiba Camps Logo" class="brand-logo-img" />
          <div class="brand-divider"></div>
          <img src="./assets/logos/promedia-logo.png" alt="ProMedia Logo" class="brand-logo-img" />
        </div>
        <div class="brand-title-badge">
          <span class="brand-name" id="nav-brand-text">نويبع كامبس × بروميديا</span>
          <span class="brand-badge">Strategic Proposal 2026</span>
        </div>
      </div>

      <!-- Timeline Section Links -->
      <nav class="nav-timeline" id="nav-timeline" aria-label="Section Timeline"></nav>

      <!-- Nav Actions -->
      <div class="nav-actions">
        <button class="btn-lang" id="lang-toggle-btn" aria-label="Toggle Language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>English</span>
        </button>

        <a href="https://nuweibacamps.com/" target="_blank" rel="noopener noreferrer" class="btn-official-site" id="nav-official-btn">
          <span>الموقع الرسمي</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>

        <button class="btn-menu-toggle" id="mobile-toggle-btn" aria-label="Toggle Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Drawer -->
  <div class="mobile-nav-drawer" id="mobile-drawer"></div>

  <!-- Main Content Structure — 16 Strategic Sections -->
  <main>
    <!-- Premium Agency Opening Sequence: ProMedia Presents -->
    <section id="agency-intro" class="agency-intro-section">
      <div id="section-agency-intro" style="width: 100%;"></div>
    </section>

    <!-- Section 01: Cover & Strategic Vision -->
    <section id="cover" class="hero-section">
      <div id="section-cover" style="width: 100%;"></div>
    </section>

    <!-- Section 02: Understanding the Brand -->
    <section id="brand-understanding" class="section section-alt">
      <div id="section-brand-understanding"></div>
    </section>

    <!-- Section 03: Challenge vs. Opportunity -->
    <section id="challenge-opportunity" class="section">
      <div id="section-challenge-opportunity"></div>
    </section>

    <!-- Section 04: Target Audience Strategy -->
    <section id="target-audience" class="section section-alt">
      <div id="section-target-audience"></div>
    </section>

    <!-- Section 05: The ProMedia 4-Engine Development Model -->
    <section id="promedia-model" class="section section-dark">
      <div id="section-promedia-model"></div>
    </section>

    <!-- Section 06: Influencer Marketing (Mega) -->
    <section id="mega-influencers" class="section">
      <div id="section-mega-influencers"></div>
    </section>

    <!-- Section 07: Mini Influencer Marketing -->
    <section id="mini-influencers" class="section section-alt">
      <div id="section-mini-influencers"></div>
    </section>

    <!-- Section: Influencer Network (Dream.xlsx) -->
    <section id="influencer-network" class="section">
      <div id="section-influencer-network"></div>
    </section>

    <!-- Section: UGC Creators Directory (Dream.xlsx) -->
    <section id="ugc-creators" class="section section-alt">
      <div id="section-ugc-creators"></div>
    </section>

    <!-- Section: Campaign Planning Packages -->
    <section id="campaign-packages" class="section">
      <div id="section-campaign-packages"></div>
    </section>

    <!-- Section 08: UGC Production -->
    <section id="ugc-production" class="section">
      <div id="section-ugc-production"></div>
    </section>

    <!-- Section 09: EGC Production -->
    <section id="egc-production" class="section section-alt">
      <div id="section-egc-production"></div>
    </section>

    <!-- Section 10: Content Development Strategy -->
    <section id="content-pillars" class="section">
      <div id="section-content-pillars"></div>
    </section>

    <!-- Section 11: Paid Media & Conversion -->
    <section id="paid-media" class="section section-alt">
      <div id="section-paid-media"></div>
    </section>

    <!-- Section 12: Digital Experience Development -->
    <section id="digital-experience" class="section">
      <div id="section-digital-experience"></div>
    </section>

    <!-- Section 13: Measurement and Reporting (KPIs) -->
    <section id="kpis" class="section section-alt">
      <div id="section-kpis"></div>
    </section>

    <!-- Section 14: Three-Month Execution Roadmap -->
    <section id="roadmap" class="section">
      <div id="section-roadmap"></div>
    </section>

    <!-- Section 15: Reference Board and Deliverables -->
    <section id="reference-board" class="section section-alt">
      <div id="section-reference-board"></div>
    </section>

    <!-- Section 16: Why ProMedia? -->
    <section id="why-promedia" class="why-promedia-section">
      <div id="section-why-promedia"></div>
    </section>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-container">
      <div class="footer-brand">
        <img src="./assets/logos/nuweiba-logo.png" alt="Nuweiba Camps" class="footer-logo" />
        <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.15);"></div>
        <img src="./assets/logos/promedia-logo.png" alt="ProMedia" class="footer-logo" />
        <span style="font-weight: 700; color: #FFFFFF; font-size: 0.95rem;">Nuweiba Camps × ProMedia</span>
      </div>

      <div id="footer-agency-text" style="font-size: 0.82rem; color: #64748B;">
        بروميديا للإنتاج الإعلامي وصناعة المحتوى الرقمي · 2026
      </div>

      <div>
        <a href="https://nuweibacamps.com/" target="_blank" rel="noopener noreferrer" style="color: var(--color-turquoise); font-weight: 700; display: inline-flex; align-items: center; gap: 4px;">
          <span>nuweibacamps.com</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>
    </div>
  </footer>

  <!-- Lightbox Media Modal -->
  <div class="modal-overlay" id="media-modal" role="dialog" aria-modal="true" aria-label="Media Preview">
    <div class="modal-content">
      <button class="modal-close-btn" id="modal-close-btn" aria-label="Close Preview">&times;</button>
      <div id="modal-media-slot"></div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
